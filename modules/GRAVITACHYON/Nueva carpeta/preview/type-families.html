<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="row gap-3" style="display:grid;grid-template-columns:repeat(3,1fr);">
  <div style="border:1px solid var(--line-200);padding:14px;background:var(--bg-panel)">
    <div class="lbl">DISPLAY</div>
    <div style="font-family:var(--font-display);font-size:32px;font-weight:500;letter-spacing:-0.02em;margin-top:4px;line-height:1">Aa Bb 0–9</div>
    <div class="mono" style="font-size:10px;color:#8A8D99;margin-top:10px;">Space Grotesk · 400/500/600/700</div>
  </div>
  <div style="border:1px solid var(--line-200);padding:14px;background:var(--bg-panel)">
    <div class="lbl">UI</div>
    <div style="font-family:var(--font-ui);font-size:32px;font-weight:500;letter-spacing:-0.01em;margin-top:4px;line-height:1">Aa Bb 0–9</div>
    <div class="mono" style="font-size:10px;color:#8A8D99;margin-top:10px;">Inter Tight · 300–700</div>
  </div>
  <div style="border:1px solid var(--line-200);padding:14px;background:var(--bg-panel)">
    <div class="lbl">MONO</div>
    <div style="font-family:var(--font-mono);font-size:32px;font-weight:500;margin-top:4px;line-height:1">Aa Bb 0–9</div>
    <div class="mono" style="font-size:10px;color:#8A8D99;margin-top:10px;">JetBrains Mono · 300–700</div>
  </div>
</div>
</div></body></html>
