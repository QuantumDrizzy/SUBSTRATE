<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="col gap-4">
  <div class="row gap-4">
    <div style="flex:1;border:1px solid #00F0FF;background:rgba(0,240,255,0.06);box-shadow:0 0 24px -4px rgba(0,240,255,0.45);padding:16px;">
      <div class="lbl" style="color:#00F0FF">SIGNAL · CYAN</div>
      <div style="font-family:var(--font-mono);font-size:24px;color:#00F0FF;text-shadow:0 0 12px rgba(0,240,255,0.45);margin-top:8px;letter-spacing:-0.01em;">#00F0FF</div>
      <div class="lbl" style="margin-top:6px">LIVE DATA · ARMED · FOCUS</div>
    </div>
    <div style="flex:1;border:1px solid #FF9000;background:rgba(255,144,0,0.06);box-shadow:0 0 24px -4px rgba(255,144,0,0.45);padding:16px;">
      <div class="lbl" style="color:#FF9000">WARNING · ORANGE</div>
      <div style="font-family:var(--font-mono);font-size:24px;color:#FF9000;text-shadow:0 0 12px rgba(255,144,0,0.45);margin-top:8px;letter-spacing:-0.01em;">#FF9000</div>
      <div class="lbl" style="margin-top:6px">ANOMALY · ALERT</div>
    </div>
  </div>
</div>
</div></body></html>
