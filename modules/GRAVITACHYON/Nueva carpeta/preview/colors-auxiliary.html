<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="swatch-row" style="grid-template-columns: repeat(4, 1fr);">
  <div class="sw" style="background:#0C0C10"><span style="color:#5CFFA8;font-family:var(--font-mono);font-size:14px;text-shadow:0 0 8px rgba(92,255,168,0.4)">NOMINAL</span><span class="name">green</span><span class="hex">#5CFFA8</span></div>
  <div class="sw" style="background:#0C0C10"><span style="color:#FF3344;font-family:var(--font-mono);font-size:14px;text-shadow:0 0 8px rgba(255,51,68,0.4)">CRITICAL</span><span class="name">red</span><span class="hex">#FF3344</span></div>
  <div class="sw" style="background:#0C0C10"><span style="color:#FF2E88;font-family:var(--font-mono);font-size:14px;text-shadow:0 0 8px rgba(255,46,136,0.4)">TACHYON</span><span class="name">magenta</span><span class="hex">#FF2E88</span></div>
  <div class="sw" style="background:#0C0C10"><span style="color:#8C5CFF;font-family:var(--font-mono);font-size:14px;text-shadow:0 0 8px rgba(140,92,255,0.4)">GRAVITY</span><span class="name">violet</span><span class="hex">#8C5CFF</span></div>
</div>
</div></body></html>
