<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="row gap-4" style="display:grid;grid-template-columns:repeat(3,1fr);">

    <div class="lbl">PANEL</div>
    <div class="mono" style="font-size:10px;color:#8A8D99">inset hairline · default</div>

    <div class="lbl">RAISED</div>
    <div class="mono" style="font-size:10px;color:#8A8D99">button · input</div>
  </div>

    <div class="mono" style="font-size:10px;color:#8A8D99">glass · backdrop blur 16</div>
  </div>
</div>

  <div style="background:#08080A;border:1px solid #00F0FF;box-shadow:0 0 12px 0 rgba(0,240,255,0.45);padding:18px;display:flex;justify-content:space-between"><div class="lbl" style="color:#00F0FF">GLOW · CYAN</div><span class="mono" style="font-size:10px;color:#8A8D99">armed</span></div>
  <div style="background:#08080A;border:1px solid #FF9000;box-shadow:0 0 12px 0 rgba(255,144,0,0.45);padding:18px;display:flex;justify-content:space-between"><div class="lbl" style="color:#FF9000">GLOW · ORANGE</div><span class="mono" style="font-size:10px;color:#8A8D99">anomaly</span></div>
</div>
</div></body></html>
