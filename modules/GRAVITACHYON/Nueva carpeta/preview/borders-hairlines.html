<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="row gap-3" style="display:grid;grid-template-columns:repeat(4,1fr);">
  <div style="border:1px solid rgba(244,245,247,0.06);padding:18px 12px;background:#0C0C10"><div class="lbl">LINE 100</div><div class="mono" style="font-size:10px;color:#8A8D99;margin-top:6px">6% · row dividers</div></div>
  <div style="border:1px solid rgba(244,245,247,0.10);padding:18px 12px;background:#0C0C10"><div class="lbl">LINE 200</div><div class="mono" style="font-size:10px;color:#8A8D99;margin-top:6px">10% · panel default</div></div>
  <div style="border:1px solid rgba(244,245,247,0.16);padding:18px 12px;background:#0C0C10"><div class="lbl">LINE 300</div><div class="mono" style="font-size:10px;color:#8A8D99;margin-top:6px">16% · hover</div></div>
  <div style="border:1px solid rgba(244,245,247,0.24);padding:18px 12px;background:#0C0C10"><div class="lbl">LINE 400</div><div class="mono" style="font-size:10px;color:#8A8D99;margin-top:6px">24% · emphasis</div></div>
</div>
<div class="row gap-3" style="display:grid;grid-template-columns:1fr 1fr;margin-top:12px;">
  <div style="border:1px solid #00F0FF;padding:18px 12px;background:rgba(0,240,255,0.04);box-shadow:0 0 24px -6px rgba(0,240,255,0.45)"><div class="lbl" style="color:#00F0FF">CYAN · ARMED</div></div>
  <div style="border:1px solid #FF9000;padding:18px 12px;background:rgba(255,144,0,0.04);box-shadow:0 0 24px -6px rgba(255,144,0,0.45)"><div class="lbl" style="color:#FF9000">ORANGE · ANOMALY</div></div>
</div>
</div></body></html>
