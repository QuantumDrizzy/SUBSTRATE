<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn{font-family:var(--font-mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;padding:10px 18px;border:1px solid var(--line-300);background:#121218;color:#F4F5F7;cursor:pointer;}
.btn--primary{border-color:#00F0FF;color:#00F0FF;background:rgba(0,240,255,0.06);box-shadow:0 0 12px 0 rgba(0,240,255,0.45);}
.btn--warn{border-color:#FF9000;color:#FF9000;background:rgba(255,144,0,0.06);box-shadow:0 0 12px 0 rgba(255,144,0,0.45);}
.btn--ghost{background:transparent;color:#C7C9D1;border-color:rgba(244,245,247,0.10)}
.btn--disabled{color:#3A3D49;border-color:rgba(244,245,247,0.06);background:transparent;cursor:not-allowed}
.btn--icon{padding:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body><div class="card">
<div class="col gap-4">
  <div class="row gap-3" style="flex-wrap:wrap"><button class="btn btn--primary">ARM</button><button class="btn">LOCK</button><button class="btn btn--warn">PURGE</button><button class="btn btn--ghost">CANCEL</button><button class="btn btn--disabled">ACQUIRE</button></div>
  <div class="row gap-3" style="flex-wrap:wrap;align-items:center"><button class="btn btn--icon"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5,3 17,10 5,17"/></svg></button><button class="btn btn--icon"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="10" height="10"/></svg></button><button class="btn btn--icon"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="10" x2="16" y2="10"/><line x1="10" y1="4" x2="10" y2="16"/></svg></button><span class="mono" style="font-size:10px;color:#8A8D99">PRIMARY · DEFAULT · WARNING · GHOST · DISABLED · ICON</span></div>
</div>
</div></body></html>
