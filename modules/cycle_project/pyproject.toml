[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cycle_project"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths     = ["tests"]
addopts       = "-v --tb=short"
python_files  = ["test_*.py"]
python_classes= ["Test*"]
python_functions = ["test_*"]
