[package]
name = "field_coherence"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "field_coherence"
path = "src/main.rs"

[dependencies]
eframe     = "0.27"
egui       = "0.27"
egui_plot  = "0.27"
reqwest    = { version = "0.12", features = ["blocking", "json"] }
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite   = { version = "0.31", features = ["bundled"] }
notify-rust = "4"
chrono     = "0.4"
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = "0.3"
