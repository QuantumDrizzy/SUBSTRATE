[project]
name = "terra-qci"
version = "0.1.0"
description = "Global Quantum Coherence Grid — biological decoherence monitor"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "cupy-cuda12x>=13.0",
    "pyrtlsdr>=0.3.0",
    "requests>=2.31",
    "plotly>=5.18",
    "dash>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "black", "ruff"]
