[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cryptotn-gpu"
version = "0.1.0"
description = "GPU-accelerated tensor network engine for cryptochrome radical pair spin dynamics"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "quimb>=1.7",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0",
    "cuquantum-python-cu12>=24.03",
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptotn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
