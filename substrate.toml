[substrate]
name    = "SUBSTRATE"
version = "0.2.0"

[layers]
quantum      = { enabled = true,  weight = 1.5, params = { chi = 256, backend = "cupy" } }
geomagnetic  = { enabled = true,  weight = 2.0 }
magnon       = { enabled = true,  weight = 1.2 }
quantum_lab  = { enabled = true,  weight = 1.0, params = { chi = 512 } }
solar        = { enabled = true,  weight = 1.3 }
cosmological = { enabled = true,  weight = 0.8 }
eeg          = { enabled = true,  weight = 1.8, params = { mode = "auto" } }
lunar        = { enabled = true,  weight = 1.4 }
radio        = { enabled = true,  weight = 1.6 }
seismic      = { enabled = true,  weight = 1.1 }

# ── New modules (integrated 2026-05-28) ───────────────────────────
[layers.simulations]
enabled     = true
weight      = 1.0
description = "Multi-domain physics simulations: cosmology, quantum, astrophysics"
submodules  = ["cosmology", "quantum", "astrophysics", "bci_bridge", "sonification"]
data_dir    = "modules/simulations/data"

[layers.simulations.bci_bridge]
enabled     = true
weight      = 1.8
description = "KHAOS EEG → physics parameter bridge (mind_state.json IPC)"
mind_state_ttl_secs = 15
connects_to = ["khaos", "helios"]

[layers.pattern_analysis]
enabled     = true
weight      = 1.0
description = "Cross-modal spectral analysis: Rust Welch FFT + Python PNG/JSON analytics"
rust_engine = "modules/pattern_analysis/rust_engine"
connects_to = ["simulations"]

[output]
db_path     = "data/substrate.db"
report_path = "data/processed/substrate_report.json"
